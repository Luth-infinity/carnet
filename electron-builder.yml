appId: com.luthinfinity.carnet
productName: Carnet
copyright: Copyright © 2026 Luth

directories:
  output: release
  buildResources: build

# L'interface est exportée par Next.js dans out/. Toutes ses dépendances y sont
# déjà bundlées : seul electron-updater, utilisé par le principal, est une
# dépendance de production embarquée.
files:
  - electron/**/*
  - out/**/*
  - build/icon.png
  - package.json
  - '!**/*.map'

asar: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png

# electron-updater lit `latest.yml` dans la release GitHub la plus récente
publish:
  provider: github
  owner: Luth-infinity
  repo: carnet

nsis:
  # Installation en un clic, par utilisateur : une mise à jour ne rouvre pas
  # d'assistant et ne demande pas les droits administrateur
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

linux:
  target: [AppImage]
  category: Office
